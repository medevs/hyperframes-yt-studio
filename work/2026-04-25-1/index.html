<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Daily — 2026-04-25</title>
<!-- Local Inter font (latin subset, ~90 KB total). No network round-trip. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/inter-400.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/inter-500.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/inter-600.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/inter-800.woff2">
<link rel="stylesheet" href="assets/motion-primitives.css">
<style>
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/inter-400.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('assets/fonts/inter-500.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('assets/fonts/inter-600.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 800; font-display: swap; src: url('assets/fonts/inter-800.woff2') format('woff2'); }

  :root {
    --bg-primary: #0A0A0A;
    --bg-secondary: #1A1A1A;
    --fg-primary: #F5F5F5;
    --fg-secondary: #A0A0A0;
    --accent: #0066FF;
    --divider: #2A2A2A;
  }
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    background: var(--bg-primary);
    color: var(--fg-primary);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }

  /* Each scene wrapper fills the canvas; opacity managed by master GSAP. */
  .scene-wrap { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0; }
  #intro-comp { opacity: 1; } /* first scene visible at t=0 */

  /* Beats are full-bleed cells stacked inside scenes; GSAP fades them in/out */
  .beat {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    display: grid;
    box-sizing: border-box;
    opacity: 0;
  }

  .grid-decorative .grid-h, .grid-decorative .grid-v { background: var(--divider); position: absolute; }
  .grid-decorative .grid-h { left: 0; right: 0; height: 1px; }
  .grid-decorative .grid-v { top: 0; bottom: 0; width: 1px; }

  .source-chip {
    position: absolute;
    right: 80px; bottom: 60px;
    font-size: 22px; font-weight: 600; letter-spacing: 1px;
    color: var(--fg-secondary); text-transform: lowercase;
    padding: 10px 18px;
    border: 1px solid var(--divider);
    background: rgba(26, 26, 26, 0.85);
    backdrop-filter: blur(4px);
    z-index: 50;
    opacity: 0;
  }

  /* INTRO */
  .beat-hero {
    grid-template-rows: 1fr auto auto auto 1fr;
    grid-template-columns: 1fr;
    align-items: center;
    justify-items: center;
    padding: 0 120px;
    text-align: center;
  }
  .beat-hero .date-label {
    grid-row: 2;
    font-size: 32px; font-weight: 500; letter-spacing: 4px;
    color: var(--fg-secondary); text-transform: uppercase;
    margin-bottom: 24px;
  }
  .beat-hero .hero-title {
    grid-row: 3;
    font-size: 280px; font-weight: 800; letter-spacing: -8px;
    line-height: 0.9; color: var(--fg-primary);
  }
  .beat-hero .hero-title .ai { color: var(--accent); }
  .beat-hero .accent-rule {
    grid-row: 4;
    margin-top: 36px;
    width: 320px; height: 8px;
    background: var(--accent);
    transform-origin: center;
  }

  .teaser {
    grid-template-columns: 520px 1fr;
    grid-template-rows: 1fr;
    align-items: center;
    padding: 0 120px;
  }
  .teaser .teaser-num {
    grid-column: 1; grid-row: 1;
    font-size: 360px; font-weight: 800; letter-spacing: -10px;
    line-height: 0.85;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-align: left;
    align-self: center;
  }
  .teaser .teaser-text {
    grid-column: 2; grid-row: 1;
    font-size: 84px; font-weight: 800; letter-spacing: -2px;
    line-height: 1.05; color: var(--fg-primary);
    align-self: center;
    padding-left: 40px;
  }
  .teaser .teaser-meta {
    position: absolute;
    top: 80px; left: 120px;
    font-size: 24px; font-weight: 500; letter-spacing: 2px;
    color: var(--fg-secondary); text-transform: uppercase;
  }

  /* STORY shared beats */
  .beat-cold-open {
    grid-template-columns: 720px 1fr;
    grid-template-rows: 1fr;
    align-items: center;
    padding: 0 120px;
    gap: 60px;
  }
  .beat-cold-open .story-num-big {
    grid-column: 1; grid-row: 1;
    font-size: 480px; font-weight: 800; letter-spacing: -16px;
    line-height: 0.85;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    align-self: center;
  }
  .beat-cold-open .story-headline {
    grid-column: 2; grid-row: 1;
    font-size: 96px; font-weight: 800; letter-spacing: -2px;
    line-height: 1.05; color: var(--fg-primary);
    align-self: center;
  }

  .beat-headline-hold {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    place-items: center;
    padding: 0 120px;
    text-align: center;
  }
  .beat-headline-hold .ghost-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.20;
    filter: grayscale(40%) brightness(0.6);
    z-index: 0;
  }
  .beat-headline-hold .ghost-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.85) 100%);
    z-index: 1;
  }
  .beat-headline-hold .label-above {
    position: relative; z-index: 2;
    font-size: 28px; font-weight: 500; letter-spacing: 4px;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 32px;
  }
  .beat-headline-hold .hero-headline {
    position: relative; z-index: 2;
    font-size: 144px; font-weight: 800; letter-spacing: -3px;
    line-height: 1.0; color: var(--fg-primary);
    max-width: 1500px;
  }

  .beat-stat {
    grid-template-rows: 1fr auto auto 1fr;
    grid-template-columns: 1fr;
    place-items: center;
    text-align: center;
    padding: 0 120px;
  }
  .beat-stat .stat-label {
    grid-row: 2;
    font-size: 32px; font-weight: 500; letter-spacing: 4px;
    color: var(--fg-secondary); text-transform: uppercase;
    margin-bottom: 32px;
  }
  .beat-stat .stat-value {
    grid-row: 3;
    font-size: 320px; font-weight: 800; letter-spacing: -10px;
    line-height: 0.85;
    color: var(--fg-primary);
    font-variant-numeric: tabular-nums;
    display: flex; align-items: baseline; justify-content: center; gap: 12px;
  }
  .beat-stat .stat-value .prefix,
  .beat-stat .stat-value .suffix {
    font-size: 200px; font-weight: 800; color: var(--accent);
    letter-spacing: -6px;
  }
  .beat-stat .stat-sub {
    grid-row: 4;
    margin-top: 32px;
    font-size: 28px; font-weight: 500; letter-spacing: 2px;
    color: var(--fg-secondary); text-transform: uppercase;
  }

  .beat-quote {
    grid-template-rows: 1fr auto auto 1fr;
    grid-template-columns: 1fr;
    place-items: center;
    text-align: center;
    padding: 0 120px;
  }
  .beat-quote .quote-mark {
    grid-row: 2;
    font-size: 200px; font-weight: 800; line-height: 0.6;
    color: var(--accent);
    margin-bottom: 24px;
  }
  .beat-quote .quote-text {
    grid-row: 3;
    font-size: 132px; font-weight: 800; letter-spacing: -3px;
    line-height: 1.05; color: var(--fg-primary);
    max-width: 1600px;
  }
  .beat-quote .quote-attr {
    grid-row: 4;
    margin-top: 48px;
    font-size: 32px; font-weight: 500; letter-spacing: 4px;
    color: var(--fg-secondary); text-transform: uppercase;
  }

  .beat-visual {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }
  .beat-visual .kb-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    will-change: transform;
  }
  .beat-visual .kb-vignette {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0.30) 0%, rgba(10,10,10,0.20) 50%, rgba(10,10,10,0.92) 100%);
    z-index: 1;
  }
  .beat-visual .kb-caption {
    position: absolute;
    left: 120px; right: 120px; bottom: 100px;
    z-index: 2;
    font-size: 64px; font-weight: 800; letter-spacing: -1px;
    line-height: 1.1;
    color: var(--fg-primary);
    text-align: center;
  }
  .beat-visual .kb-caption .kw { color: var(--accent); }

  .beat-statbar {
    grid-template-rows: 1fr auto auto 1fr;
    grid-template-columns: 1fr;
    place-items: center;
    padding: 0 120px;
    text-align: center;
  }
  .beat-statbar .sb-label {
    grid-row: 2;
    font-size: 32px; font-weight: 500; letter-spacing: 4px;
    color: var(--fg-secondary); text-transform: uppercase;
    margin-bottom: 36px;
  }
  .beat-statbar .sb-row { grid-row: 3; width: 1400px; }
  .beat-statbar .sb-row .stat-bar { width: 100%; }
  .beat-statbar .sb-row .stat-bar .bar-track { height: 32px; }
  .beat-statbar .sb-row .stat-bar .bar-label { font-size: 32px; min-width: 360px; }
  .beat-statbar .sb-row .stat-bar .bar-value { font-size: 96px; min-width: 180px; }
  .beat-statbar .sb-cap {
    grid-row: 4;
    margin-top: 56px;
    font-size: 36px; font-weight: 600; letter-spacing: 1px;
    color: var(--fg-primary);
  }

  .beat-takeaway {
    grid-template-rows: 1fr auto auto 1fr;
    grid-template-columns: 1fr;
    place-items: center;
    text-align: center;
    padding: 0 120px;
  }
  .beat-takeaway .tk-label {
    grid-row: 2;
    font-size: 28px; font-weight: 500; letter-spacing: 6px;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 40px;
  }
  .beat-takeaway .tk-text {
    grid-row: 3;
    font-size: 132px; font-weight: 800; letter-spacing: -3px;
    line-height: 1.0; color: var(--fg-primary);
    max-width: 1600px;
  }
  .beat-takeaway .tk-rule {
    grid-row: 4;
    margin-top: 48px;
    width: 240px; height: 6px;
    background: var(--accent);
  }

  /* OUTRO */
  .beat-outro-hero {
    grid-template-rows: 1fr auto auto auto 1fr;
    grid-template-columns: 1fr;
    place-items: center;
    text-align: center;
  }
  .beat-outro-hero .hero-title {
    grid-row: 2;
    font-size: 280px; font-weight: 800; letter-spacing: -8px;
    line-height: 0.9; color: var(--fg-primary);
  }
  .beat-outro-hero .hero-title .ai { color: var(--accent); }
  .beat-outro-hero .out-rule {
    grid-row: 3;
    margin-top: 36px;
    width: 320px; height: 8px;
    background: var(--accent);
    transform-origin: center;
  }
  .beat-outro-hero .out-fb {
    grid-row: 4;
    margin-top: 32px;
    font-size: 36px; font-weight: 500; letter-spacing: 6px;
    color: var(--fg-secondary); text-transform: uppercase;
  }

  .beat-outro-cta {
    grid-template-rows: 1fr auto auto 1fr;
    grid-template-columns: 1fr;
    place-items: center;
    text-align: center;
    padding: 0 120px;
  }
  .beat-outro-cta .cta-fb {
    grid-row: 2;
    font-size: 96px; font-weight: 800; letter-spacing: -2px;
    color: var(--fg-primary);
    margin-bottom: 36px;
  }
  .beat-outro-cta .cta-text {
    grid-row: 3;
    font-size: 56px; font-weight: 600; letter-spacing: 1px;
    color: var(--accent);
  }

  .count-up { display: inline-block; }
</style>
<script src="assets/gsap.min.js"></script>
<script>
window.__hf = window.__hf || { selfHosted: true };
// Master timeline registry: required by HF lint. Sub-compositions register
// their own timelines on window.__timelines[<scene-id>]; the master is empty
// because the runtime composes scenes via data-composition-src + data-start.
window.__timelines = window.__timelines || {};
// Register the master timeline SYNCHRONOUSLY in <head> so the studio's
// player probe finds it. Defer DOM-querying tweens to DOMContentLoaded.
(function() {
  const tl = gsap.timeline({ paused: true });
  tl.to({}, { duration: 186.12 }, 0);
  window.__timelines['ai-daily'] = tl;
  document.addEventListener('DOMContentLoaded', () => {
    // Scene cross-cuts on wrapper opacity (only one scene opaque at a time)
    tl.set('#intro-comp',   { opacity: 0 }, 14.67);
    tl.set('#story-1-comp', { opacity: 1 }, 14.67);
    tl.set('#story-1-comp', { opacity: 0 }, 71.24);
    tl.set('#story-2-comp', { opacity: 1 }, 71.24);
    tl.set('#story-2-comp', { opacity: 0 }, 125.55);
    tl.set('#story-3-comp', { opacity: 1 }, 125.55);
    tl.set('#story-3-comp', { opacity: 0 }, 176.30);
    tl.set('#outro-comp',   { opacity: 1 }, 176.30);
  });
})();
</script>
</head>
<body>
<div id="ai-daily" data-composition-id="ai-daily" data-width="1920" data-height="1080" data-start="0" data-duration="186.12">

  <!-- Audio: track 0 — must NOT have class="clip" -->
  <audio id="narration" data-start="0" data-duration="186.12" data-track-index="0" src="narration.wav" preload="auto"></audio>

  <!-- 5 sub-compositions, each with its own GSAP timeline registered to window.__timelines[id] -->
  <div id="intro-comp"   class="scene-wrap" data-composition-id="intro"   data-composition-src="compositions/intro.html"   data-start="0"      data-duration="14.67" data-track-index="1"></div>
  <div id="story-1-comp" class="scene-wrap" data-composition-id="story-1" data-composition-src="compositions/story-1.html" data-start="14.67" data-duration="56.57" data-track-index="1"></div>
  <div id="story-2-comp" class="scene-wrap" data-composition-id="story-2" data-composition-src="compositions/story-2.html" data-start="71.24" data-duration="54.31" data-track-index="1"></div>
  <div id="story-3-comp" class="scene-wrap" data-composition-id="story-3" data-composition-src="compositions/story-3.html" data-start="125.55" data-duration="50.75" data-track-index="1"></div>
  <div id="outro-comp"   class="scene-wrap" data-composition-id="outro"   data-composition-src="compositions/outro.html"   data-start="176.30" data-duration="9.82"  data-track-index="1"></div>

</div>
</body>
</html>
