<div data-composition-id="x" data-width="1920" data-height="1080" data-start="0" data-duration="60">

       scene's timeline. Three inner clips at distinct starts = 3 moments. -->

    <div class="clip" data-start="2" data-duration="10" data-track-index="2"></div>
    <div class="clip" data-start="14" data-duration="10" data-track-index="2"></div>
    <div class="clip" data-start="28" data-duration="10" data-track-index="2"></div>
  </div>
</div>
</body></html>
